<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Icon Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #0f0f0f;
            color: white;
        }
        canvas {
            margin: 10px;
            border: 1px solid #333;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>📧 Extension Icon Generator</h1>
    <p>Click the buttons below to generate and download icons:</p>
    
    <div>
        <canvas id="canvas16" width="16" height="16"></canvas>
        <canvas id="canvas48" width="48" height="48"></canvas>
        <canvas id="canvas128" width="128" height="128"></canvas>
    </div>
    
    <div>
        <button onclick="generateIcons()">Generate Icons</button>
        <button onclick="downloadIcon(16)">Download 16x16</button>
        <button onclick="downloadIcon(48)">Download 48x48</button>
        <button onclick="downloadIcon(128)">Download 128x128</button>
    </div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(0, 0, size, size);
            
            // Envelope shape
            const padding = size * 0.15;
            const envWidth = size - (padding * 2);
            const envHeight = envWidth * 0.65;
            const x = padding;
            const y = (size - envHeight) / 2;
            
            // Envelope body
            ctx.fillStyle = 'white';
            ctx.fillRect(x, y, envWidth, envHeight);
            
            // Envelope flap
            ctx.fillStyle = '#e0e7ff';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + envWidth / 2, y + envHeight * 0.4);
            ctx.lineTo(x + envWidth, y);
            ctx.closePath();
            ctx.fill();
            
            // Envelope outline
            ctx.strokeStyle = '#1e40af';
            ctx.lineWidth = size * 0.03;
            ctx.strokeRect(x, y, envWidth, envHeight);
            
            // Flap line
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + envWidth / 2, y + envHeight * 0.4);
            ctx.lineTo(x + envWidth, y);
            ctx.stroke();
        }
        
        function generateIcons() {
            drawIcon(document.getElementById('canvas16'), 16);
            drawIcon(document.getElementById('canvas48'), 48);
            drawIcon(document.getElementById('canvas128'), 128);
            alert('Icons generated! Click download buttons to save them.');
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        }
        
        // Generate icons on load
        window.onload = generateIcons;
    </script>
</body>
</html>
